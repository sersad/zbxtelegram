---
- name: install_dependencies | Установить системные пакеты (RED OS)
  tags:
    - install
  package:
    name:
      - python3
      - python3-pip
      - python3-devel
      - libjpeg-turbo-devel
      - zlib-devel
      - gcc
      - libffi-devel
      - openssl-devel
      - policycoreutils-python-utils
    state: present
  register: pkg_install
  until: pkg_install is succeeded
  when:
    - ansible_os_family == "RED"

...
