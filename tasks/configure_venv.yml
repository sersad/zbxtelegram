---
- name: 'configure_venv | Принудительно удалить старое виртуальное окружение'
  tags:
    - install
    - venv
  file:
    path: "{{ zbxtelegram_venv_dir }}"
    state: absent
  when: zbxtelegram_venv_recreate | default(false) | bool
  become: true

- name: 'configure_venv | Проверить наличие Python 3.13'
  tags:
    - install
    - venv
  stat:
    path: "{{ python_exec }}"
  register: python_check

- name: 'configure_venv | Скачать и распаковать Python 3.13 (Standalone)'
  tags:
    - install
    - venv
  block:
    - name: 'Download Python 3.13 standalone'
      get_url:
        url: "{{ python_standalone_url }}"
        dest: "/tmp/cpython-3.13.tar.gz"
        mode: "0644"
        timeout: 300
        use_proxy: yes
        validate_certs: false  # Отключите только если прокси с самоподписанным cert
      environment:
        http_proxy: "{{ http_proxy | default('') }}"
        https_proxy: "{{ https_proxy | default(http_proxy) | default('') }}"
        no_proxy: "{{ no_proxy | default('') }}"
      retries: 3
      delay: 10

    - unarchive:
        src: "/tmp/cpython-3.13.tar.gz"
        dest: "{{ python_install_base }}"
        remote_src: yes
        creates: "{{ python_exec }}"
    - file:
        path: "/tmp/cpython-3.13.tar.gz"
        state: absent
  when: not python_check.stat.exists
  become: true

- name: 'configure_venv | Создать виртуальное окружение'
  tags:
    - install
    - venv
  command:
    cmd: "{{ python_exec }} -m venv {{ zbxtelegram_venv_dir }}"
    creates: "{{ zbxtelegram_venv_dir }}/bin/activate"
  become: true
  become_user: "{{ zbxtelegram_user }}"

- name: 'configure_venv | Обновить pip в виртуальном окружении'
  tags:
    - install
    - venv
  command:
    cmd: "{{ zbxtelegram_venv_dir }}/bin/pip install --upgrade pip setuptools wheel"
    creates: "{{ zbxtelegram_venv_dir }}/bin/pip3"
  become: true
  become_user: "{{ zbxtelegram_user }}"

- name: 'configure_venv | Скопировать файл зависимостей'
  tags:
    - install
    - venv
  copy:
    src: requirements.txt
    dest: "{{ zbxtelegram_alertscripts_dir }}/requirements.txt"
    owner: "{{ zbxtelegram_user }}"
    group: "{{ zbxtelegram_group }}"
    mode: "0644"
  notify:
    - Configure virtual environment

- name: 'configure_venv | Установить зависимости в виртуальное окружение c proxy'
  tags:
    - install
    - venv
  pip:
    requirements: "{{ zbxtelegram_alertscripts_dir }}/requirements.txt"
    virtualenv: "{{ zbxtelegram_venv_dir }}"
    # virtualenv_command убран: venv создаётся явно выше, это предотвращает конфликты версий pip
    extra_args: "--no-cache-dir --disable-pip-version-check --proxy {{ http_proxy | default('') }}"
  become: true
  become_user: "{{ zbxtelegram_user }}"
  register: pip_install
  until: pip_install is succeeded
  when: http_proxy is defined and http_proxy != ""

- name: 'configure_venv | Установить зависимости в виртуальное окружение без прокси'
  tags:
    - install
    - venv
  pip:
    requirements: "{{ zbxtelegram_alertscripts_dir }}/requirements.txt"
    virtualenv: "{{ zbxtelegram_venv_dir }}"
    extra_args: "--no-cache-dir --disable-pip-version-check"
  become: true
  become_user: "{{ zbxtelegram_user }}"
  register: pip_install
  until: pip_install is succeeded
  when: http_proxy is not defined

- name: 'configure_venv | Патч aiozabbix для Zabbix 7+ (user → username)'
  tags:
    - install
    - venv
  replace:
    path: "{{ zbxtelegram_venv_dir }}/lib/python3.13/site-packages/aiozabbix/__init__.py"
    regexp: 'await sub\.user\.login\(user='
    replace: 'await sub.user.login(username='
  become: true
  become_user: "{{ zbxtelegram_user }}"

...
